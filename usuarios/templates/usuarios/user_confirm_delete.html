{% extends "base.html" %}

{% block title %}Eliminar Usuario{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm" style="max-width: 600px;">
    <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
        <h5 class="fw-bold mt-3 mb-2">¿Está seguro de eliminar este usuario?</h5>
        <p class="text-muted small mb-1">{{ object.get_full_name|default:object.username }} (@{{ object.username }})</p>
        <p class="text-muted small mb-4">Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash me-1"></i>Eliminar
            </button>
            <a href="{% url 'usuarios:detalle' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
