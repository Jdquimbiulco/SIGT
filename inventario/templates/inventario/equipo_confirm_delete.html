{% extends "base.html" %}

{% block title %}Eliminar Equipo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem;"></i>
                <h4 class="fw-bold mt-3">¿Eliminar este equipo?</h4>
                <p class="text-muted">
                    Está a punto de eliminar <strong>{{ equipo }}</strong>
                    (N.° de serie: {{ equipo.numero_serie }}) del inventario.
                    Esta acción no se puede deshacer.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Sí, eliminar
                        </button>
                        <a href="{% url 'inventario:detalle' equipo.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
